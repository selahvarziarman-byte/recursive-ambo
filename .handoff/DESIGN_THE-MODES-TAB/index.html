<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The modes tab — three designs</title>
<style>
  :root {
    --ground: #0c0a09; --ground2: #1c1917; --rule: #292524; --rule2: #44403c;
    --ink: #f5f5f4; --ink2: #d6d3d1; --muted: #a8a29e; --dim: #78716c;
    --act: #fde68a; --pair: #fcd34d; --light: #c4b5fd; --light2: #ddd6fe; --warn: #fca5a5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font: 12px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button.link { text-decoration: underline; color: var(--ink2); }
  button.act { color: var(--act); text-decoration: underline; }
  input.word { height: 20px; width: 110px; border: 1px solid var(--rule2); background: var(--ground2); color: var(--ink); border-radius: 3px; padding: 0 4px; font: inherit; }
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
  header h1 { font: 600 15px/1.2 Georgia, "Times New Roman", serif; margin: 0 8px 0 0; }
  header .group { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  header .group > span { color: var(--dim); }
  .chip { border: 1px solid var(--rule2); border-radius: 3px; padding: 2px 8px; color: var(--ink2); }
  .chip[aria-pressed="true"] { border-color: var(--act); color: var(--act); }
  main { display: flex; gap: 20px; padding: 14px 16px; align-items: flex-start; flex-wrap: wrap; }
  .frame { display: flex; flex-direction: column; gap: 4px; }
  .frame .cap { color: var(--dim); }
  .pane { width: 440px; height: calc(100vh - 110px); min-height: 480px; overflow-y: auto; border: 1px solid var(--rule2); border-radius: 4px; padding: 8px 10px; background: var(--ground); }
  .tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin-bottom: 6px; color: var(--dim); }
  .tabs .on { color: var(--ink); border-bottom: 1px solid var(--ink); }
  aside { flex: 1; min-width: 300px; max-width: 640px; color: var(--ink2); }
  aside h2 { font: 600 14px/1.3 Georgia, serif; color: var(--ink); margin: 0 0 6px; }
  aside h3 { font-size: 12px; color: var(--ink); margin: 14px 0 4px; }
  aside p, aside li { margin: 0 0 6px; }
  aside ul { padding-left: 18px; margin: 0; }
  .muted { color: var(--muted); } .dim { color: var(--dim); } .act { color: var(--act); } .light { color: var(--light); } .warn { color: var(--warn); }
  .sec { margin: 10px 0 4px; color: var(--muted); }
  .line { margin: 2px 0; }
  .sep { color: var(--dim); }
  .words { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .words .is { color: var(--pair); }
  .words .rule { width: 1px; align-self: stretch; background: var(--rule2); margin: 0 2px; }
  .words button.w { color: var(--ink2); }
  .words button.w.on { color: var(--ink); text-decoration: underline; }
  .facts { margin: 4px 0 2px; padding: 4px 6px; border-left: 2px solid var(--rule2); }
  .card { border: 1px solid var(--rule2); border-radius: 4px; padding: 6px 8px; margin: 6px 0; }
  .route { margin: 6px 0; padding-left: 8px; border-left: 2px solid var(--rule); }
  .route .legs { color: var(--light2); }
  .route.edges .legs { color: var(--ink2); }
  .route.refused .legs, .route.cut .legs { color: var(--dim); }
  .kind { color: var(--dim); }
  .struck { text-decoration: line-through; color: var(--dim); }
  /* the grid */
  .grid { display: grid; grid-template-columns: 96px repeat(var(--cols), 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-top: 6px; }
  .grid > div { background: var(--ground); min-height: 38px; padding: 2px 3px; overflow: hidden; }
  .grid .colh { min-height: 64px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; }
  .grid .colh span { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); white-space: nowrap; max-height: 60px; overflow: hidden; text-overflow: ellipsis; }
  .grid .rowh { color: var(--muted); display: flex; align-items: center; white-space: nowrap; text-overflow: ellipsis; }
  .grid .cell { cursor: pointer; font-size: 10px; line-height: 1.3; }
  .grid .cell:hover { background: var(--ground2); }
  .grid .cell.sel { outline: 1px solid var(--act); outline-offset: -1px; }
  .grid .cell .rel { color: var(--ink); overflow-wrap: anywhere; display: block; font-size: 9.5px; line-height: 1.15; }
  .grid .cell .rel.bar { text-decoration: line-through; color: var(--dim); }
  .grid .cell .marks { display: block; white-space: nowrap; }
  .legend { color: var(--dim); font-size: 11px; margin: 4px 0; }
  /* the queue */
  .drawing { display: block; margin: 4px 0 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .relchip { border: 1px solid var(--rule2); border-radius: 3px; padding: 1px 6px; }
  select { background: var(--ground2); color: var(--ink); border: 1px solid var(--rule2); border-radius: 3px; font: inherit; max-width: 100%; }
  /* the ledger */
  details { margin: 4px 0; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; color: var(--dim); }
  details[open] > summary::before { content: "▾ "; }
  .today .t { margin: 1px 0; color: var(--ink2); }
  @media (max-width: 520px) { .pane { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>The modes tab — three designs</h1>
  <div class="group"><span>sitting:</span>
    <button class="chip" data-fix="vl" aria-pressed="true">Virgin Land's, today 17:59</button>
    <button class="chip" data-fix="a2" aria-pressed="false">ARMAN-2 on the 18:34 record</button>
  </div>
  <div class="group"><span>design:</span>
    <button class="chip" data-design="combo" aria-pressed="true">1 + 2 · the grid, each route drawn</button>
    <button class="chip" data-design="grid" aria-pressed="false">1 · by the pair of roles</button>
    <button class="chip" data-design="queue" aria-pressed="false">2 · what waits</button>
    <button class="chip" data-design="ledger" aria-pressed="false">3 · by the relatings</button>
    <button class="chip" data-design="today" aria-pressed="false">today's tab</button>
  </div>
</header>
<main>
  <div class="frame">
    <div class="cap" id="cap"></div>
    <section class="pane" id="pane"></section>
  </div>
  <aside id="about"></aside>
</main>
<script>
// ─── data: read from the live page at d19c25c by extract.js, the casts as poured ───
const FIX = {
  vl: { file: 'data/vl-1759.json', title: "Virgin Land's sitting, 2026-10-09 17:59 — F–Φ, T spoke in its light (20 sayings), 6 relatings and 1 bar, 1 passage decided" },
  a2: { file: 'data/arman2-1834.json', title: "ARMAN-2's 39 in T's light on Virgin Land's 18:34 record (3 relatings, 1 bar), one override, one relating on each of T's edges" },
};
const CASTS = { F: 'F', PHI: 'PHI', T: 'T', U: 'U' };
let M = null, fixture = 'vl', design = 'combo';
const state = { sel: null, word: null, showAllWords: false, qIndex: 0, cIndex: 0, qFilter: { corner: 'all', kind: 'all', shape: 'all' }, decisions: {}, rules: {}, open: {} };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function load(fix) {
  const d = await fetch(FIX[fix].file).then((r) => r.json());
  const casts = {};
  for (const [k, f] of Object.entries(CASTS)) casts[k] = await fetch(`/repeat/casts/revival/${f}.cast.json`).then((r) => r.json());
  return build(d, casts);
}

function build(d, casts) {
  const L = (id) => d.labels[id] || id;
  const gloss = {};
  for (const c of Object.values(casts)) for (const r of c.roles) gloss[r.id] = r.gloss;
  const Froles = casts.F.roles.map((r) => r.id), Proles = casts.PHI.roles.map((r) => r.id);
  // the pair's relatings and their standing
  const ownList = (d.own || '').replace(/^not through [^:]+: /, '').split(' · ').filter(Boolean);
  const faceLists = (d.faces || []).map((f) => ({ corner: (f.match(/also through (\w+)/) || [])[1], items: f.replace(/^[^:]+: /, '').split(' · ') }));
  const relatings = d.relatings.map((r) => {
    const [w, x, y, dir] = r.key.split('|');
    const bar = /· barred ·/.test(r.line);
    const text = dir === '←' ? `${L(y)} ${w} ${L(x)}` : `${L(x)} ${w} ${L(y)}`;
    let standing = bar ? 'barred' : 'not decided yet';
    if (ownList.includes(text)) standing = 'not through T or U';
    for (const f of faceLists) if (f.items.includes(text)) standing = `also through ${f.corner}`;
    // under T: the act's lines after its own
    const i = d.actsLines.findIndex((l) => l.startsWith(text + ' ·'));
    const under = [];
    if (i >= 0) for (let k = i + 1; k < d.actsLines.length && /^at /.test(d.actsLines[k]); k++) under.push(d.actsLines[k]);
    return { w, x, y, dir, bar, text, standing, under };
  });
  // T's marks are on the end role (the cell under T), the same for every relating that ends there: read them from every
  // relating's lines, so a bar (which the page gives no under-T line, Virgin Land's 13) shows them too
  const Tlabels = casts.T.roles.map((r) => r.label).sort((a, b) => b.length - a.length);
  const marksAt = {};
  for (const r of relatings) for (const u of r.under) {
    const m = u.match(/^at (.+?): (.*)$/); if (!m) continue;
    const at = (marksAt[m[1]] ||= { present: new Set(), denied: new Set(), line: u });
    for (const it of m[2].split(' · ')) { const tl = Tlabels.find((l) => it.startsWith(l + ' ')); if (!tl) continue; (/\(doesn't hold\)$/.test(it) ? at.denied : at.present).add(tl); }
  }
  for (const r of relatings) {
    const a = marksAt[L(r.x)], b = marksAt[L(r.y)];
    r.under = [a?.line, b?.line].filter(Boolean);
    const common = a && b ? [...a.present].filter((t) => b.present.has(t)) : [];
    r.agree = common.length ? `${common.join(' and ')} at both ends` : a?.present.size && b?.present.size ? 'T at both ends, by different roles' : a?.present.size || b?.present.size ? 'T at one end' : 'T at neither end';
  }
  // the routes
  const routes = [];
  const T0 = d.views[0] || [];
  const altAt = T0.findIndex((l) => /^through T, from T's roles/.test(l));
  const nLegs = T0.slice(1, altAt < 0 ? T0.length : altAt).filter((l) => /^(both from|across)/.test(l)).length;
  d.passages.forEach((p, i) => {
    const [x, w1, z, w2, y] = p.key.split('|');
    const decidedLine = p.lines.find((l) => /^decided: /.test(l));
    routes.push({ id: 'p' + i, corner: 'T', source: i < nLegs ? 'edges' : 'light', kind: 'one role', x, y, z, w1, w2,
      legs: (p.lines[0] || '').replace(/^[^:]+: /, ''), lead: (p.lines[0] || '').replace(/:.*$/, ''),
      status: decidedLine ? 'decided' : 'open', decided: decidedLine ? decidedLine.replace(/^decided: /, '') : null,
      shape: `${w1} and ${w2} from one point`, ruleText: `one word for ${w1} and ${w2} from one point:` });
  });
  d.bonds.forEach((b, i) => {
    const [x, w1, z1, S, z2, w2, y] = b.key.split('|');
    const decidedLine = b.lines.find((l) => /^decided: /.test(l));
    const cutLine = b.lines.find((l) => /^cut: /.test(l));
    const status = b.reading === 'REFUSED' ? (b.refusal === 'denial' ? 'cut' : 'refused') : decidedLine ? 'decided' : 'open';
    routes.push({ id: 'b' + i, corner: 'T', source: 'light', kind: 'across', x, y, z1, S, z2, w1, w2,
      legs: (b.lines[0] || '').replace(/^[^:]+: /, ''), lead: "across T's relation",
      status, decided: decidedLine ? decidedLine.replace(/^decided: /, '') : null, why: status === 'refused' ? 'T refuses it' : status === 'cut' ? cutLine || 'cut: it does not hold at an end' : null,
      shape: `${w1}, ${S} and ${w2} across T's relation`, ruleText: `one word for ${w1}, ${S} and ${w2} across T's relation:` });
  });
  // corners
  const alt = (d.altHeads || []).find((a) => a.corner === 'T') || { forks: 0, bonds: 0, refused: 0, denied: 0 };
  const underT = (d.point || []).find((l) => /^under T:/.test(l)) || null;
  const uLine = (d.point || []).find((l) => /^U's roles:/.test(l)) || "U's roles: none related to F or Φ here yet";
  const corners = [
    { name: 'T', edges: nLegs, oneRole: alt.forks, across: alt.bonds, refused: alt.refused, cut: alt.denied, under: underT,
      edgesNone: (d.viewHeads[0] || '').match(/\(([^)]*)\)/)?.[1] || null },
    { name: 'U', edges: 0, oneRole: 0, across: 0, refused: 0, cut: 0, under: null, silent: uLine, edgesNone: (d.viewHeads[1] || '').match(/\(([^)]*)\)/)?.[1] || null },
  ];
  // parallels
  const Frefused = new Set(d.parallels.filter((p) => p.discordance && /^F refuses/.test(p.text)).map((p) => p.key.split('|').slice(1, 4).join('|')));
  const Trefused = new Set(routes.filter((r) => r.status === 'refused').map((r) => `${r.S}|${r.z1}|${r.z2}`));
  const parallels = d.parallels.map((p) => {
    const [end, fw, a, b, S, z1, z2] = p.key.split('|');
    const f = `${L(a)} ${fw} ${L(b)}`, t = `${L(z1)} ${S} ${L(z2)}`;
    const fRef = Frefused.has(`${fw}|${a}|${b}`), tRef = Trefused.has(`${S}|${z1}|${z2}`);
    let text;
    if (fRef && tRef) text = `${end} refuses "${f}", and beside it T refuses "${t}"`;
    else if (fRef) text = `${end} refuses "${f}"; beside it, T's "${t}" spans the same two roles; both are kept`;
    else if (tRef) text = `T refuses "${t}"; beside it, ${end}'s "${f}" spans the same two roles; both are kept`;
    else text = `${end}'s "${f}" beside T's "${t}"`;
    return { end, text, today: p.text, both: fRef && tRef, discordance: fRef !== tRef };
  });
  const words = d.words.map((w) => ({ ...w, isIS: w.word === 'IS', here: relatings.some((r) => r.w === w.word) }));
  const pairsUsed = new Set(relatings.map((r) => r.x + '|' + r.y)).size;
  return { d, L, gloss, Froles, Proles, relatings, routes, corners, parallels, words, pairsUsed, nLegs };
}

// ─── shared pieces ───
const routeStatus = (r) => {
  const dec = state.decisions[r.id];
  if (dec) return { status: 'decided', text: dec.to === null ? 'comes to nothing' : `${M.L(r.x)} ${dec.to} ${M.L(r.y)}`, local: true };
  if (r.status === 'decided') return { status: 'decided', text: r.decided };
  return { status: r.status };
};
const openCount = () => M.routes.filter((r) => routeStatus(r).status === 'open').length;
const kindName = (r) => r.source === 'edges' ? `by T's edges` : r.kind === 'one role' ? 'by one role' : "across T's relation";

function wordsStrip() {
  const ws = M.words.filter((w) => !w.isIS);
  const here = ws.filter((w) => w.here), rest = ws.filter((w) => !w.here);
  const shown = state.showAllWords ? ws : here;
  const btn = (w) => `<button class="w ${state.word === w.word ? 'on' : ''}" data-word="${esc(w.word)}">${esc(w.word)}</button>`;
  let h = `<div class="words"><span class="dim">modes</span><button class="is ${state.word === 'IS' ? 'on' : ''}" data-word="IS">IS ≡</button><span class="rule"></span>`;
  h += shown.map(btn).join('<span class="sep">·</span>') || '<span class="dim">no word of his here yet</span>';
  h += ` <span class="sep">·</span> <button class="link">+ a mode</button>`;
  if (rest.length) h += ` <span class="sep">·</span> <button class="link" data-allwords>${state.showAllWords ? 'only this edge’s words' : `${rest.length} more ${rest.length === 1 ? 'word' : 'words'} · show`}</button>`;
  h += '</div>';
  const w = M.words.find((x) => x.word === state.word);
  if (w && !w.isIS) {
    h += `<div class="facts"><div>${w.dirs.map((d) => `<button class="link">${esc(d.text)}</button>`).join(' <span class="sep">·</span> ')} <span class="dim">— neither chosen until he chooses; never carried from another word</span></div>`;
    h += `<div>${w.converse ? esc(w.converse) : esc(w.word) + ' the other way round: <button class="link">a word</button>'}</div>`;
    h += `<div>in ${esc(w.word)}, ${w.opaque.map((o) => `<button class="${o.chosen ? 'act' : 'link'}">${esc(o.text)}</button>`).join(' <span class="sep">·</span> ')}</div></div>`;
  } else if (w && w.isIS) {
    h += `<div class="facts"><span class="dim">IS ≡ is the reserved pairing: paired roles become one. His own words follow the rule.</span></div>`;
  }
  return h;
}

function headLine() {
  const rel = M.relatings.filter((r) => !r.bar).length, bars = M.relatings.filter((r) => r.bar).length;
  const cells = M.Froles.length * M.Proles.length;
  return `<div class="line">${M.d.edge}: ${rel} ${rel === 1 ? 'relating' : 'relatings'}${bars ? ` · ${bars} ${bars === 1 ? 'bar' : 'bars'}` : ''}, on ${M.pairsUsed} of the ${cells} pairs of roles</div>`;
}

function cornersLine(compact) {
  return M.corners.map((c) => {
    if (c.name === 'U' || (c.oneRole + c.across + c.edges + c.refused + c.cut === 0)) return `<div class="line"><b>${c.name}</b> <span class="dim">— ${esc(c.silent || `${c.name}'s roles: none related here yet`)} · <button class="link">open ${c.name}'s light</button></span></div>`;
    const parts = [];
    parts.push(c.edges ? `${c.edges} by its edges` : `nothing on its edges`);
    parts.push(`<span class="light">${c.oneRole} by one role · ${c.across} across its relations</span>`);
    let ref = [];
    if (c.refused) ref.push(`${c.refused} that ${c.name} refuses`);
    if (c.cut) ref.push(`${c.cut} cut by a denial`);
    return `<div class="line"><b>${c.name}</b> — ${parts.join(' · ')}${ref.length ? ` <span class="dim">· ${ref.join(' · ')}</span>` : ''}</div>` + (compact ? '' : (c.under ? `<div class="line dim">${esc(c.under)}</div>` : ''));
  }).join('');
}

function routeHTML(r, opts = {}) {
  const st = routeStatus(r);
  const cls = r.source === 'edges' ? 'edges' : st.status;
  let h = `<div class="route ${cls}"><div><span class="kind">${esc(r.lead)}:</span> <span class="legs">${esc(r.legs)}</span></div>`;
  if (st.status === 'refused') h += `<div class="dim">T refuses it</div>`;
  else if (st.status === 'cut') h += `<div class="dim">${esc(r.why)}</div>`;
  else if (st.status === 'decided') h += `<div>decided: ${esc(st.text)} <span class="sep">·</span> <button class="act" data-withdraw="${r.id}">withdraw</button></div>`;
  else h += `<div class="dim">not decided yet</div><div>comes to ${esc(M.L(r.x))} <input class="word" placeholder="a word" data-wordfor="${r.id}"> ${esc(M.L(r.y))} <span class="sep">·</span> <button class="act" data-decide="${r.id}">decide</button> <span class="sep">·</span> <button class="act" data-nothing="${r.id}">comes to nothing</button></div>`;
  if (opts.rule && st.status === 'open' && !shownRules.has(r.shape)) { shownRules.add(r.shape); h += ruleHTML(r); }
  return h + '</div>';
}
let shownRules = new Set(); // a shape's rule is offered once per page, under its first waiting passage

function ruleHTML(r) {
  const named = state.rules[r.shape];
  const n = M.routes.filter((x) => x.shape === r.shape && routeStatus(x).status === 'open').length;
  if (named) return `<div class="dim">rule: ${esc(r.shape)} → ${esc(named)}, on every such passage <span class="sep">·</span> <button class="act" data-unrule="${esc(r.shape)}">withdraw</button></div>`;
  return `<div class="dim">${esc(r.ruleText)} <input class="word" placeholder="a word" data-rulefor="${esc(r.shape)}"> <button class="act" data-rule="${esc(r.shape)}">name it</button> <span class="dim">(${n} ${n === 1 ? 'passage' : 'passages'} of this shape here; a rule holds across the solid)</span></div>`;
}

function parallelsHTML(key) {
  const open = state.open[key];
  const byEnd = { F: M.parallels.filter((p) => p.end === 'F').length, Φ: M.parallels.filter((p) => p.end !== 'F').length };
  let h = `<div class="line">parallels: ${byEnd.F} with F's relations · ${byEnd.Φ} with Φ's <span class="sep">·</span> <button class="link" data-toggle="${key}">${open ? 'hide' : 'show'}</button></div>`;
  if (open) h += M.parallels.map((p) => `<div class="line ${p.both || p.discordance ? 'muted' : ''}">${esc(p.text)}</div>`).join('');
  return h;
}

// ─── design 1: by the pair of roles ───
function gridDesign(opts = { panel: true }) {
  const cells = {};
  for (const r of M.routes) (cells[r.x + '|' + r.y] ||= { routes: [], rels: [] }).routes.push(r);
  for (const r of M.relatings) (cells[r.x + '|' + r.y] ||= { routes: [], rels: [] }).rels.push(r);
  let h = wordsStrip() + headLine() + `<div class="sec">what the corners carry</div>` + cornersLine(true);
  h += `<div class="grid" style="--cols:${M.Proles.length}"><div></div>` + M.Proles.map((y) => `<div class="colh" title="${esc(M.gloss[y])}"><span>${esc(M.L(y))}</span></div>`).join('');
  for (const x of M.Froles) {
    h += `<div class="rowh" title="${esc(M.gloss[x])}">${esc(M.L(x))}</div>`;
    for (const y of M.Proles) {
      const c = cells[x + '|' + y] || { routes: [], rels: [] };
      const open = c.routes.filter((r) => routeStatus(r).status === 'open');
      const dec = c.routes.filter((r) => routeStatus(r).status === 'decided').length;
      const ref = c.routes.filter((r) => ['refused', 'cut'].includes(routeStatus(r).status)).length;
      const edges = open.filter((r) => r.source === 'edges').length;
      const light = open.filter((r) => r.source === 'light').length;
      const rel = c.rels.map((r) => `<span class="rel ${r.bar ? 'bar' : ''}" title="${esc(r.text)}">${r.dir === '←' ? '↑' : '↓'} ${esc(r.w)}</span>`).join('');
      const marks = [edges ? `<span>▲${edges}</span>` : '', light ? `<span class="light">●${light}</span>` : '', ref ? `<span class="dim">✕${ref}</span>` : '', dec ? `<span class="act">✓${dec}</span>` : ''].filter(Boolean).join(' ');
      const sel = state.sel === x + '|' + y ? 'sel' : '';
      h += `<div class="cell ${sel}" data-cell="${x}|${y}" title="${esc(M.L(x))} · ${esc(M.L(y))}">${rel}<span class="marks">${marks}</span></div>`;
    }
  }
  h += `</div><div class="legend">a word with ↑ or ↓: a relating, read from the column's role or the row's · struck: a bar · waiting: ▲ by T's edges, <span class="light">●</span> in T's light · <span class="act">✓</span> decided · ✕ refused or cut</div>`;
  if (!opts.panel) return h;
  if (state.sel) {
    const [x, y] = state.sel.split('|');
    const c = cells[state.sel] || { routes: [], rels: [] };
    h += `<div class="card"><div><b>${esc(M.L(x))}</b> <span class="sep">·</span> <b>${esc(M.L(y))}</b></div>`;
    h += c.rels.length ? c.rels.map((r) => `<div class="line ${r.bar ? 'struck' : ''}">${esc(r.text)} <span class="dim">· ${esc(r.standing)}</span></div>`).join('') : `<div class="dim">nothing related between these two yet</div>`;
    const groups = [['by T\u2019s edges', (r) => r.source === 'edges'], ['in T\u2019s light, by one role', (r) => r.source === 'light' && r.kind === 'one role'], ['in T\u2019s light, across its relations', (r) => r.kind === 'across' && !['refused', 'cut'].includes(r.status)], ['refused or cut', (r) => ['refused', 'cut'].includes(r.status)]];
    for (const [name, f] of groups) {
      const rs = c.routes.filter(f);
      if (!rs.length) continue;
      h += `<div class="sec">through T, ${name}: ${rs.length}</div>` + rs.map((r) => routeHTML(r, { rule: true })).join('');
    }
    if (!c.routes.length) h += `<div class="dim">no passage through T or U reaches these two</div>`;
    h += `</div>`;
  } else h += `<div class="dim" style="margin:6px 0">choose a pair of roles to read what passes there</div>`;
  h += parallelsHTML('gp');
  h += `<div class="line">${openCount()} passages through T not decided yet</div>`;
  return h;
}

// ─── design 1 + 2: the grid, and a chosen cell's routes each drawn, one at a time (Arman, 18:46) ───
function comboDesign() {
  const cells = {};
  for (const r of M.routes) (cells[r.x + '|' + r.y] ||= { routes: [], rels: [] }).routes.push(r);
  for (const r of M.relatings) (cells[r.x + '|' + r.y] ||= { routes: [], rels: [] }).rels.push(r);
  // the grid itself is design 1's, cell for cell
  let h = gridDesign({ panel: false });
  if (!state.sel) return h + `<div class="dim" style="margin:6px 0">choose a pair of roles: its routes open below, each drawn</div>` + gridFoot();
  const [x, y] = state.sel.split('|');
  const c = cells[state.sel] || { routes: [], rels: [] };
  const rank = (r) => (r.source === 'edges' ? 0 : r.kind === 'one role' ? 1 : 2) * 10 + ({ open: 0, decided: 1, refused: 2, cut: 3 }[routeStatus(r).status] ?? 4);
  const rs = [...c.routes].sort((a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id));
  let p = `<div class="card"><div><b>${esc(M.L(x))}</b> <span class="sep">·</span> <b>${esc(M.L(y))}</b></div>`;
  p += c.rels.length ? c.rels.map((r) => `<div class="line ${r.bar ? 'struck' : ''}">${esc(r.text)} <span class="dim">· ${esc(r.standing)} · ${esc(r.agree)}</span></div>`).join('') : `<div class="dim">nothing related between these two yet</div>`;
  if (!rs.length) return h + p + `<div class="dim">no passage through T or U reaches these two</div></div>` + gridFoot();
  const all = state.open['call'];
  state.cIndex = Math.max(0, Math.min(state.cIndex, rs.length - 1));
  const waiting = rs.filter((r) => routeStatus(r).status === 'open').length;
  p += `<div class="dim" style="margin-top:6px">${rs.length} ${rs.length === 1 ? 'route' : 'routes'} through T here${waiting ? ` · ${waiting} not decided yet` : ''}${all ? '' : ` · ${state.cIndex + 1} of ${rs.length} · <button class="link" data-c="-1">previous</button> · <button class="link" data-c="1">next</button>`} · <button class="link" data-toggle="call">${all ? 'one at a time' : `all ${rs.length} · show`}</button></div>`;
  const one = (r) => `<div class="line" style="margin-top:6px"><span class="dim">${esc(kindName(r))}</span></div>` + drawRoute(r) + routeHTML(r, { rule: true });
  p += all ? rs.map(one).join('') : one(rs[state.cIndex]);
  return h + p + `</div>` + gridFoot();
}
function gridFoot() { return parallelsHTML('cp') + `<div class="line">${openCount()} passages through T not decided yet</div>`; }

// ─── design 2: what waits ───
function queueDesign() {
  let h = wordsStrip() + headLine();
  h += `<div class="chips">` + M.relatings.map((r) => `<span class="relchip ${r.bar ? 'struck' : ''}" title="${esc(r.standing)}">${esc(r.text)} <span class="dim">· ${esc(r.standing)}</span></span>`).join('') + `</div>`;
  h += `<div class="sec">what the corners carry</div>` + cornersLine(false);
  const f = state.qFilter;
  const pool = M.routes.filter((r) => routeStatus(r).status === 'open' || state.decisions[r.id]);
  const order = (r) => M.Froles.indexOf(r.x) * 100 + M.Proles.indexOf(r.y);
  const shapes = [...new Set(pool.map((r) => r.shape))].sort();
  const q = pool.filter((r) => (f.kind === 'all' || kindName(r) === f.kind) && (f.shape === 'all' || r.shape === f.shape)).sort((a, b) => order(a) - order(b) || a.id.localeCompare(b.id));
  const waiting = q.filter((r) => routeStatus(r).status === 'open').length;
  h += `<div class="sec">waiting: ${openCount()} passages not decided yet</div>`;
  h += `<div class="line">kind <select data-qf="kind"><option value="all">every kind</option>${['by T\u2019s edges'.replace('\u2019', "'"), 'by one role', "across T's relation"].map((k) => `<option ${f.kind === k ? 'selected' : ''}>${k}</option>`).join('')}</select> shape <select data-qf="shape"><option value="all">every shape (${shapes.length})</option>${shapes.map((s) => `<option value="${esc(s)}" ${f.shape === s ? 'selected' : ''}>${esc(s)} (${pool.filter((r) => r.shape === s).length})</option>`).join('')}</select></div>`;
  if (!q.length) return h + `<div class="dim">nothing waits here</div>` + parallelsHTML('qp');
  state.qIndex = Math.max(0, Math.min(state.qIndex, q.length - 1));
  const r = q[state.qIndex];
  h += `<div class="card"><div class="dim">${state.qIndex + 1} of ${q.length}${waiting !== q.length ? ` · ${waiting} still waiting` : ''} · <button class="link" data-q="-1">previous</button> · <button class="link" data-q="1">next</button></div>`;
  h += `<div class="line"><b>${esc(M.L(r.x))}</b> <span class="sep">·</span> <b>${esc(M.L(r.y))}</b> <span class="dim">· ${esc(kindName(r))}</span></div>`;
  h += drawRoute(r) + routeHTML(r) + ruleHTML(r) + `</div>`;
  const ref = M.routes.filter((x) => ['refused', 'cut'].includes(x.status));
  h += `<div class="line">refused: ${ref.filter((x) => x.status === 'refused').length} that T refuses · ${ref.filter((x) => x.status === 'cut').length} cut by a denial <span class="sep">·</span> <button class="link" data-toggle="qr">${state.open.qr ? 'hide' : 'show'}</button></div>`;
  if (state.open.qr) h += ref.map((x) => routeHTML(x)).join('');
  const dec = M.routes.filter((x) => routeStatus(x).status === 'decided');
  h += `<div class="line">decided: ${dec.length} <span class="sep">·</span> <button class="link" data-toggle="qd">${state.open.qd ? 'hide' : 'show'}</button></div>`;
  if (state.open.qd) h += dec.map((x) => routeHTML(x)).join('');
  h += parallelsHTML('qp');
  return h;
}

function drawRoute(r) {
  // F's role ← T's role(s) → Φ's role, in the light's colour; the edges' in ink
  const col = r.source === 'edges' ? '#d6d3d1' : '#c4b5fd';
  const W = 400, y0 = 18, y1 = 46;
  const tz = r.kind === 'across' ? [M.L(r.z1), M.L(r.z2)] : [M.L(r.z)];
  const tx = tz.length === 2 ? [150, 250] : [200];
  let s = `<svg class="drawing" width="${W}" height="64" viewBox="0 0 ${W} 64" role="img" aria-label="${esc(r.legs)}">`;
  s += `<text x="40" y="${y1 + 4}" fill="#a8a29e" font-size="11" text-anchor="middle">${esc(M.L(r.x))}</text><text x="${W - 40}" y="${y1 + 4}" fill="#a8a29e" font-size="11" text-anchor="middle">${esc(M.L(r.y))}</text>`;
  tz.forEach((t, i) => { s += `<text x="${tx[i]}" y="${y0 - 4}" fill="${col}" font-size="11" text-anchor="middle">${esc(t)}</text>`; });
  s += `<line x1="${tx[0]}" y1="${y0}" x2="40" y2="${y1 - 8}" stroke="${col}"/><line x1="${tx[tx.length - 1]}" y1="${y0}" x2="${W - 40}" y2="${y1 - 8}" stroke="${col}"/>`;
  if (tx.length === 2) s += `<line x1="${tx[0] + 30}" y1="${y0 - 8}" x2="${tx[1] - 30}" y2="${y0 - 8}" stroke="${col}" stroke-dasharray="${r.status === 'refused' || r.status === 'cut' ? '4 3' : ''}"/>`;
  s += `<text x="${(40 + tx[0]) / 2 - 4}" y="${(y0 + y1) / 2 - 7}" fill="${col}" font-size="10" text-anchor="end">${esc(r.w1)}</text><text x="${(W - 40 + tx[tx.length - 1]) / 2 + 4}" y="${(y0 + y1) / 2 - 7}" fill="${col}" font-size="10">${esc(r.w2)}</text>`;
  if (tx.length === 2) s += `<text x="200" y="${y0 + 8}" fill="${col}" font-size="10" text-anchor="middle">${esc(r.S)}</text>`;
  return s + '</svg>';
}

// ─── design 3: by the relatings ───
function ledgerDesign() {
  let h = wordsStrip() + headLine();
  h += `<div class="sec">the relatings, and what the corners say of each</div>`;
  for (const r of M.relatings) {
    const rs = M.routes.filter((x) => x.x === r.x && x.y === r.y);
    const key = 'l' + r.x + r.y + r.w;
    h += `<details ${state.open[key] ? 'open' : ''} data-det="${key}"><summary><span class="${r.bar ? 'struck' : ''}">${esc(r.text)}</span> <span class="dim">· ${esc(r.standing)} · ${esc(r.agree)}${rs.length ? ` · ${rs.length} through T` : ''}</span></summary>`;
    h += r.under.length ? r.under.map((u) => `<div class="line light">${esc(u)}</div>`).join('') : `<div class="line dim">under T: nothing related at either end yet</div>`;
    h += rs.map((x) => routeHTML(x, { rule: true })).join('');
    h += `</details>`;
  }
  // the open ground: routes on pairs with no relating
  const related = new Set(M.relatings.map((r) => r.x + '|' + r.y));
  const ground = M.routes.filter((r) => !related.has(r.x + '|' + r.y) && !['refused', 'cut'].includes(r.status));
  const pairs = [...new Set(ground.map((r) => r.x + '|' + r.y))].sort((a, b) => { const [ax, ay] = a.split('|'), [bx, by] = b.split('|'); return M.Froles.indexOf(ax) - M.Froles.indexOf(bx) || M.Proles.indexOf(ay) - M.Proles.indexOf(by); });
  h += `<div class="sec">where nothing is related yet: ${ground.length} passages through T, on ${pairs.length} pairs of roles <button class="link" data-toggle="lg">${state.open.lg ? 'hide' : 'show'}</button></div>`;
  if (state.open.lg) for (const p of pairs) {
    const [x, y] = p.split('|'); const rs = ground.filter((r) => r.x === x && r.y === y); const key = 'g' + p;
    h += `<details ${state.open[key] ? 'open' : ''} data-det="${key}"><summary>${esc(M.L(x))} · ${esc(M.L(y))} <span class="dim">· ${rs.length} through T</span></summary>${rs.map((r) => routeHTML(r, { rule: true })).join('')}</details>`;
  }
  const ref = M.routes.filter((x) => ['refused', 'cut'].includes(x.status));
  h += `<div class="sec">refused: ${ref.filter((x) => x.status === 'refused').length} that T refuses · ${ref.filter((x) => x.status === 'cut').length} cut by a denial <button class="link" data-toggle="lr">${state.open.lr ? 'hide' : 'show'}</button></div>`;
  if (state.open.lr) h += ref.map((x) => routeHTML(x)).join('');
  h += `<div class="sec">what the corners carry</div>` + cornersLine(false);
  h += parallelsHTML('lp');
  h += `<div class="line">${openCount()} passages through T not decided yet</div>`;
  return h;
}

// ─── render and events ───
function render() {
  document.querySelectorAll('[data-fix]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.fix === fixture)));
  document.querySelectorAll('[data-design]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.design === design)));
  document.getElementById('cap').textContent = FIX[fixture].title;
  shownRules = new Set();
  const tabs = `<div class="tabs"><span>the point</span><span class="on">modes</span><span>corners</span><span>traces</span></div>`;
  const body = design === 'combo' ? comboDesign() : design === 'grid' ? gridDesign() : design === 'queue' ? queueDesign() : design === 'ledger' ? ledgerDesign() : todayView();
  document.getElementById('pane').innerHTML = tabs + body;
  document.getElementById('about').innerHTML = ABOUT[design] + (design === 'today' ? '' : COMMON);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, .cell, summary');
  if (!t) return;
  if (t.dataset.fix) { fixture = t.dataset.fix; Object.assign(state, { sel: null, word: null, qIndex: 0, decisions: {}, rules: {}, open: {} }); start(); return; }
  if (t.dataset.design) { design = t.dataset.design; render(); return; }
  if (t.dataset.cell) { state.sel = state.sel === t.dataset.cell ? null : t.dataset.cell; state.cIndex = 0; render(); return; }
  if (t.dataset.c) { state.cIndex += +t.dataset.c; render(); return; }
  if (t.dataset.word) { state.word = state.word === t.dataset.word ? null : t.dataset.word; render(); return; }
  if (t.hasAttribute('data-allwords')) { state.showAllWords = !state.showAllWords; render(); return; }
  if (t.dataset.toggle) { state.open[t.dataset.toggle] = !state.open[t.dataset.toggle]; render(); return; }
  if (t.dataset.q) { state.qIndex += +t.dataset.q; render(); return; }
  if (t.dataset.decide) { const v = document.querySelector(`[data-wordfor="${t.dataset.decide}"]`)?.value.trim(); if (v) { state.decisions[t.dataset.decide] = { to: v }; render(); } return; }
  if (t.dataset.nothing) { state.decisions[t.dataset.nothing] = { to: null }; render(); return; }
  if (t.dataset.withdraw) { delete state.decisions[t.dataset.withdraw]; render(); return; }
  if (t.dataset.rule) { const v = document.querySelector(`[data-rulefor="${CSS.escape(t.dataset.rule)}"]`)?.value.trim(); if (v) { state.rules[t.dataset.rule] = v; render(); } return; }
  if (t.dataset.unrule) { delete state.rules[t.dataset.unrule]; render(); return; }
  if (t.tagName === 'SUMMARY') { const d = t.parentElement; setTimeout(() => { state.open[d.dataset.det] = d.open; }, 0); }
});
