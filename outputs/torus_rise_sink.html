var m=new THREE.MeshStandardMaterial({color:color,emissive:color,emissiveIntensity:0.25,roughness:0.5,transparent:true,opacity:0});group.add(new THREE.Mesh(g,m));return m;}
var aMat=tube(D.aLoop,0xd6962c),bMat=tube(D.bLoop,0x347099);
var selected=false;var st={y:D.oceanY,body:1,loop:0,panel:0};
var dragX=0,dragY=0,tY=0.1,down=false,px=0,py=0,moved=false;
canvas.addEventListener('pointerdown',function(e){down=true;moved=false;px=e.clientX;py=e.clientY;});
window.addEventListener('pointerup',function(){down=false;});
window.addEventListener('pointermove',function(e){if(!down)return;moved=true;dragY+=(e.clientX-px)*0.008;dragX+=(e.clientY-py)*0.008;px=e.clientX;py=e.clientY;});
canvas.addEventListener('wheel',function(e){camera.position.z=Math.max(4.5,Math.min(16,camera.position.z+e.deltaY*0.01));e.preventDefault();},{passive:false});
canvas.addEventListener('click',function(){if(moved)return;selected=!selected;
document.getElementById('hint').textContent=selected?'click again to release it into the water':'click the form to raise it into its specimen';
document.getElementById('kicker').textContent=selected?'the specimen — its true structure, on select':'a torus, drifting — the real engine immersion';});
var panel=document.getElementById('panel');
function frame(){requestAnimationFrame(frame);
var ty=selected?D.specY:D.oceanY,tb=selected?0.38:1,tl=selected?1:0,tp=selected?1:0;
st.y+=(ty-st.y)*0.07;st.body+=(tb-st.body)*0.07;st.loop+=(tl-st.loop)*0.07;st.panel+=(tp-st.panel)*0.09;
group.position.y=st.y;bodyMat.opacity=st.body;aMat.opacity=st.loop;bMat.opacity=st.loop;panel.style.opacity=st.panel;
tY+=0.0016*(1-st.loop*0.75);group.rotation.y=tY+dragY;group.rotation.x=0.16+dragX;renderer.render(scene,camera);}
resize();window.addEventListener('resize',resize);frame();</script></body></html>
